<!DOCTYPE html>
<html lang="ru">
<head>
  <!-- Устанавливаем русскую кодировку и настройки для экрана ноутбука и телефона. -->
  <meta charset="utf-8" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Учебная информационная система учёта материальных ресурсов предприятия" />
  <title>МатРесурс — учёт материальных ресурсов</title>

  <!-- Этот адрес GitHub Actions автоматически заменяет на /matresurs/. -->
  <base href="/" />

  <!-- Внешний вид сайта: CSS-файл в русской папке «стили». -->
  <link rel="stylesheet" href="matresurs-graphite-turquoise-20261118.css" />

  <!-- Фиксируем базовые цвета и крупный текст меню, если браузер использует старый кэш. -->
  <style>
    html, body { background: #F6F9F8 !important; }
    .site-header { background: #26383E !important; border-bottom: 4px solid #168C8B !important; }
    .brand, .brand b { color: #FFFFFF !important; }
    .brand small { color: #C5DAD7 !important; }
    .side-nav button { color: #FFFFFF !important; font-size: 20px !important; }
    .side-nav button.selected { background: #FFFFFF !important; color: #175F60 !important; }
    .hero-banner { background: #E5F3F0 !important; }
    .primary-button, .hero-primary { background: #117675 !important; color: #FFFFFF !important; }
    .site-footer { background: #E5F3F0 !important; }
  </style>

</head>
<body>
  <!-- В этот элемент Blazor вставляет экран, написанный на C#. -->
  <div id="app">
    <div class="loading"><div class="spinner"></div>
      <p>Загружаем информационную систему…</p>
    </div>
  </div>

  <!-- Сообщение, если C#-приложение не загрузилось. -->
  <div id="blazor-error-ui" style="display:none">Не удалось запустить сайт. Обновите страницу.</div>

  <!-- Библиотека для создания настоящих Excel-файлов XLSX. -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

  <!-- Служебный JavaScript: хранение данных и скачивание Excel. -->
  <script src="Скрипты( сохранение данных и скачивание отчётов)/СохранениеИОтчёты.js"></script>

  <!-- Загрузка программы на C# (Blazor WebAssembly). -->
  <!-- Нативные диалоги выводятся в верхнем слое браузера через showModal(). -->
  <script>
    window.matresursDialogs = {
      show: function (id) {
        const dialog = document.getElementById(id);
        if (dialog && !dialog.open) dialog.showModal();
      },
      close: function (id) {
        const dialog = document.getElementById(id);
        if (dialog && dialog.open) dialog.close();
      }
    };
  </script>

  <!-- Версия скрипта меняется вместе с приложением для обновления кэша. -->
  <script src="_framework/blazor.webassembly.js?v=graphite-turquoise-20261118"></script>
</body>
</html>
