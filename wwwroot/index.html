<!DOCTYPE html>
<html lang="ru">
<head>
  <!-- Устанавливаем русскую кодировку и настройки для экрана ноутбука и телефона. -->
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Учебная информационная система учёта материальных ресурсов предприятия" />
  <title>МатРесурс — учёт материальных ресурсов</title>

  <!-- Этот адрес GitHub Actions автоматически заменяет на /matresurs/. -->
  <base href="/" />

  <!-- Внешний вид сайта: CSS-файл в русской папке «стили». -->
  <link rel="stylesheet" href="стили/site.css?v=20261111-classic-polish-v6" />
</head>
<body>
  <!-- В этот элемент Blazor вставляет экран, написанный на C#. -->
  <div id="app">
    <div class="loading"><div class="spinner"></div>
      <p>Загружаем информационную систему…</p>
    </div>
  </div>

  <!-- Сообщение, если C#-приложение не загрузилось. -->
  <div id="blazor-error-ui" style="display:none">Не удалось запустить сайт. Обновите страницу.</div>

  <!-- Служебный JavaScript: хранение данных и скачивание отчётов. -->
  <script src="Скрипты( сохранение данных и скачивание отчётов)/storage.js"></script>

  <!-- Загрузка программы на C# (Blazor WebAssembly). -->
  <!-- Нативные диалоги выводятся в верхнем слое браузера через showModal(). -->
  <script>
    window.matresursDialogs = {
      show: function (id) {
        const dialog = document.getElementById(id);
        if (dialog && !dialog.open) dialog.showModal();
      },
      close: function (id) {
        const dialog = document.getElementById(id);
        if (dialog && dialog.open) dialog.close();
      }
    };
  </script>

  <!-- Версия скрипта меняется вместе с приложением для обновления кэша. -->
  <script src="_framework/blazor.webassembly.js?v=20261111-native-dialogs-v3"></script>
</body>
</html>
