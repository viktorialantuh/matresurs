# Автоматическая публикация C#-сайта при изменениях в ветке main.
# Файл должен находиться в .github/workflows (служебное название GitHub).
name: Publish CSharp site to GitHub Pages
 # События: изменение исходного кода и ручной запуск.
on:
  push:
    branches: [main]
  workflow_dispatch:
# Права для загрузки сайта на GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write
# Только одна публикация одновременно.
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Загружаем исходный код из репозитория.
      - name: Checkout files
        uses: actions/checkout@v4
      # Устанавливаем .NET на сервере GitHub, а не на компьютере колледжа.
      - name: Install .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      # Все четыре папки с понятными именами находятся в корне репозитория.
      # Для браузера копируем CSS и JavaScript в служебную папку wwwroot.
      - name: Подготовить стили и скрипты
        run: |
          mkdir -p "wwwroot/стили" "wwwroot/Скрипты( сохранение данных и скачивание отчётов)"
          cp "стили/site.css" "wwwroot/стили/site.css"
          cp "Скрипты( сохранение данных и скачивание отчётов)/storage.js" "wwwroot/Скрипты( сохранение данных и скачивание отчётов)/storage.js"

      # Компилируем C# и Razor в статические файлы сайта.
      - name: Build Blazor WebAssembly
        run: dotnet publish MatResurs.csproj -c Release -o publish
      # Указываем правильный путь сайта, например /matresurs/.
      - name: Configure repository URL
        shell: bash
        run: |
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          OWNER="${GITHUB_REPOSITORY%%/*}"
          if [ "$REPO_NAME" = "$OWNER.github.io" ]; then
            BASE="/"
          else
            BASE="/$REPO_NAME/"
          fi
          sed -i "s|<base href=\"/\" />|<base href=\"$BASE\" />|" publish/wwwroot/index.html
          touch publish/wwwroot/.nojekyll
          echo "Base path: $BASE"
      # Последние действия: подготовить Pages, загрузить файлы, опубликовать.
      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: publish/wwwroot
      # Даём GitHub время зарегистрировать загруженный архив перед публикацией.
      - name: Дождаться регистрации файлов
        run: sleep 12

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
