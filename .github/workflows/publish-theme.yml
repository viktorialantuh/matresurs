name: Publish visual theme
on:
  issues:
    types: [opened]
permissions:
  contents: write
  issues: write
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  publish-theme:
    if: github.event.issue.user.login == github.repository_owner && startsWith(github.event.issue.title, '[MatResurs theme]')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Get source code
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Validate owner request and apply theme
        run: python3 scripts/apply_theme.py
      - name: Commit new public design
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wwwroot/theme.json
          if ! git diff --cached --quiet; then
            git commit -m "Publish theme from visual editor"
            git push origin HEAD:main
          fi
      - name: Install .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build Blazor site
        run: dotnet publish MatResurs.csproj -c Release -o publish
      - name: Configure GitHub Pages base path
        shell: bash
        run: |
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          OWNER="${GITHUB_REPOSITORY%%/*}"
          if [ "$REPO_NAME" = "$OWNER.github.io" ]; then BASE="/"; else BASE="/$REPO_NAME/"; fi
          sed -i "s|<base href=\"/\" />|<base href=\"$BASE\" />|" publish/wwwroot/index.html
          touch publish/wwwroot/.nojekyll
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: publish/wwwroot
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Close published design request
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ISSUE_NUMBER=$(python3 -c 'import json,os;print(json.load(open(os.environ["GITHUB_EVENT_PATH"]))["issue"]["number"])')
          gh issue comment "$ISSUE_NUMBER" --body "Оформление опубликовано: https://${GITHUB_REPOSITORY%%/*}.github.io/${GITHUB_REPOSITORY#*/}/"
          gh issue close "$ISSUE_NUMBER"
